title: LoM on macOS
description: 在 Apple Silicon Mac 上运行《活侠传》并安装、修复 BepInEx Mod 的实机验证指南。
theme: minima
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  toc_levels: "2"
plugins:
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-redirect-from
relative_links:
  enabled: true
  collections: false
# Short language links for the header (replaces minima's full-title header_pages).
nav:
  - { title: "简体中文", url: "/docs/guide.zhs/", lang: "zh-Hans" }
  - { title: "繁體中文", url: "/docs/guide.zht/", lang: "zh-Hant" }
  - { title: "日本語", url: "/docs/guide.ja/", lang: "ja" }
  - { title: "한국어", url: "/docs/guide.ko/", lang: "ko" }
